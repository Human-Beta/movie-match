name: Production release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA of the verified main commit to release
        required: true
        type: string
      seed_catalog:
        description: Run the controlled catalog seed after migrations
        required: true
        default: false
        type: boolean

permissions:
  checks: read
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Migrate, seed, and deploy
    environment:
      name: production
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out the requested release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha }}

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24.15.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Confirm the verified main commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          case "$RELEASE_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "release_sha must be a full lowercase commit SHA." >&2; exit 1 ;;
          esac
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          successful_checks="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "Verify" and .conclusion == "success")] | length')"
          test "$successful_checks" -gt 0

      - name: Verify production release configuration
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"
          pnpm db:target
          case "$(node -p 'new URL(process.env.DATABASE_URL).port')" in
            6543) echo "PRODUCTION_MIGRATION_DATABASE_URL must not use the transaction pooler." >&2; exit 1 ;;
          esac

      - name: Apply committed Drizzle migrations
        run: pnpm db:migrate

      - name: Seed the catalog
        if: inputs.seed_catalog
        id: seed
        run: |
          set -euo pipefail
          seed_result="$(pnpm db:seed)"
          printf '%s\n' "$seed_result"
          echo "result=$seed_result" >> "$GITHUB_OUTPUT"

      - name: Build the exact release commit for Vercel
        run: |
          pnpm dlx vercel@59.16.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@59.16.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy the Vercel production build
        id: deploy
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          deployment_url="$(pnpm dlx vercel@59.16.0 deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --meta gitCommitSha="$RELEASE_SHA" | tail -n 1)"
          test -n "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $deployment_url"

      - name: Record non-secret release evidence
        if: always()
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          SEED_RESULT: ${{ steps.seed.outputs.result }}
          SEED_CATALOG: ${{ inputs.seed_catalog }}
        run: |
          set -euo pipefail
          migration_ids="$(find drizzle -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort | paste -sd ', ' -)"
          {
            echo '## Production release evidence'
            echo
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- UTC time: \`$(date --utc +'%Y-%m-%dT%H:%M:%SZ')\`"
            echo "- Supabase project: \`$SUPABASE_PROJECT_REF\`"
            echo "- Migrations: \`$migration_ids\`"
            echo "- Catalog seed requested: \`$SEED_CATALOG\`"
            if [ -n "$SEED_RESULT" ]; then
              echo "- Seed result: $SEED_RESULT"
            fi
            if [ -n "$DEPLOYMENT_URL" ]; then
              echo "- Deployment URL: $DEPLOYMENT_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
